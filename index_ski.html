function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
var BAD='BAD';
async function open(pw){
  var bytes;
  var sub=(window.crypto&&window.crypto.subtle)?window.crypto.subtle:null;
  if(sub){
    var k;
    try{
      var k0=await sub.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      k=await sub.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
    }catch(e){sub=null;}
    if(sub){
      try{bytes=new Uint8Array(await sub.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));}
      catch(e){throw BAD;}
    }
  }
  if(!bytes){
    await new Promise(function(r){setTimeout(r,30)});
    try{bytes=window.__nobleDecrypt(pw,u(D.s),u(D.i),u(D.c),D.n);}catch(e){throw BAD;}
  }
  return new TextDecoder().decode(bytes);
}
function show(h){
  var doc=new DOMParser().parseFromString(h,'text/html');
  document.title=doc.title;
  document.head.innerHTML=doc.head.innerHTML;
  document.body.innerHTML=doc.body.innerHTML;
  document.body.className=doc.body.className;
  Array.prototype.forEach.call(document.body.querySelectorAll('script'),function(old){
    var s=document.createElement('script');s.textContent=old.textContent;old.parentNode.replaceChild(s,old);
  });
  window.scrollTo(0,0);
}
var KEY='ski27_pw';
function lsGet(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(KEY,v)}catch(e){}}
function lsDel(){try{localStorage.removeItem(KEY)}catch(e){}}
(async function(){var s=lsGet();if(s){try{show(await open(s));}catch(e){lsDel();}}})();
document.getElementById('f').onsubmit=async function(e){
  e.preventDefault();
  var err=document.getElementById('err'),btn=document.querySelector('#f button');
  var pw=document.getElementById('pw').value.trim();
  err.textContent='';btn.disabled=true;btn.textContent='解鎖中…';
  try{
    var h=await open(pw);
    if(document.getElementById('rem').checked)lsSet(pw);
    show(h);
  }catch(x){
    err.textContent=(x===BAD)?'密碼不正確':('開啟失敗：'+(x&&x.message?x.message:x));
    btn.disabled=false;btn.textContent='進入';
  }
};
